name: pre-commit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up python
        env:
          SKIP: "test,clean"
        uses: actions/setup-python@v2
        with:
          python-version: 3.13
      - uses: pre-commit/action@v3.0.0
